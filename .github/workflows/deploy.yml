name: Deploy site to GitHub Pages

# Won't actually serve anything until this repo is public — GitHub Pages on a private repo
# needs a paid plan. See docs/15-publishing.md. The workflow builds and (attempts to) deploy
# regardless, so it's already proven correct the moment the repo flips public.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wiki/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
