name: Deploy wiki site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # required: last-updated reads git log per file
      - uses: withastro/action@v6
        with:
          path: site
          # Astro 7 requires Node >=22.12.0 — the handoff pinned 20, which matched Astro 5
          # (the originally pinned version) but broke silently in CI once astro was bumped to
          # 7.2.9 for a security fix. Local builds didn't catch it: local Node was already 26.
          node-version: 22
          package-manager: npm
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
